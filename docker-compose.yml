services:
  app:
    container_name: falcon-app
    build: .
    image: speech2text:latest
    restart: always
    env_file:
      - .env
    environment:
      - PORT=8000
      - DB_HOST=falcon-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.speech2text.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.speech2text.entrypoints=websecure"
      - "traefik.http.routers.speech2text.tls.certresolver=letsencrypt"
      - "traefik.http.services.speech2text.loadbalancer.server.port=8000"
    volumes:
      - ./backend:/app/backend
      - ./audio:/app/audio
      - ./outputs:/app/outputs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      - db

  db:
    container_name: falcon-db
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-falconcall}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
