services:
  app:
    container_name: falcon-app
    build: .
    image: speech2text:latest
    restart: always
    env_file:
      - .env
    environment:
      - PORT=8000
      - DB_HOST=falcon-db
      - DB_PORT=5432
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.falcon-app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.falcon-app.entrypoints=websecure"
      - "traefik.http.routers.falcon-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.falcon-app.loadbalancer.server.port=8000"
    volumes:
      - audio_data:/app/audio
      - outputs_data:/app/outputs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - db

  db:
    container_name: falcon-db
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-falconcall}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port 5432 is NOT exposed in production for security

volumes:
  postgres_data:
  audio_data:
  outputs_data:
